server.port=${PORT:8081}
spring.datasource.url=${AIVEN_MYSQL_URL}
spring.datasource.username=${AIVEN_MYSQL_USER}
spring.datasource.password=${AIVEN_MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${FOODIE_MIGRATIONS_ENABLED:false}
spring.flyway.clean-disabled=true
spring.flyway.table=nf_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslMode=${AIVEN_MYSQL_SSL_MODE:VERIFY_IDENTITY}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
foodie.mail.enabled=${SMTP_ENABLED:false}
foodie.mail.from=${SMTP_FROM:no-reply@foodie.local}
foodie.bank-key=${BANK_ENCRYPTION_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=80MB
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}


# Cloudinary credentials are read only by the backend from CLOUDINARY_URL or CLOUDINARY_* variables.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=30s
